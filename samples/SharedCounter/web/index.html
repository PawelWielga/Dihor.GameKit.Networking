<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartyGameKit Shared Counter</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">PartyGameKit reference sample</p>
      <h1>Shared Counter</h1>
      <p id="roleLabel" class="role"></p>
    </header>

    <section class="status-card">
      <span id="statusDot" class="dot"></span>
      <strong id="status">Connecting…</strong>
      <small id="identity"></small>
    </section>

    <section class="counter-card">
      <span>Total</span>
      <strong id="total">0</strong>
      <button id="increment" type="button">+1</button>
    </section>

    <section>
      <h2>Players</h2>
      <div id="players" class="players"><p>No players yet.</p></div>
    </section>

    <section id="privatePanel" class="private-card" hidden>
      <span>Your count</span>
      <strong id="yourCount">0</strong>
    </section>

    <details>
      <summary>Join descriptor</summary>
      <code id="descriptor"></code>
    </details>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
