name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore PartyGameKit.slnx

      - name: Build
        run: dotnet build PartyGameKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PartyGameKit.slnx --configuration Release --no-build
