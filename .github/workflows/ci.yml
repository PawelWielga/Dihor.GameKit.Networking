name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.targets | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to resolve package version from Directory.Build.targets" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore PartyGameKit.slnx

      - name: Build
        run: dotnet build PartyGameKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PartyGameKit.slnx --configuration Release --no-build

      - name: Run neutral communication demo
        run: >-
          dotnet run
          --project samples/CommunicationDemo/PartyGameKit.Sample.CommunicationDemo.csproj
          --configuration Release
          --no-build

      - name: Run automatic connectivity demo
        run: >-
          dotnet run
          --project samples/AutoConnectivityDemo/PartyGameKit.Sample.AutoConnectivityDemo.csproj
          --configuration Release
          --no-build

      - name: Pack NuGet prerelease artifacts
        run: bash eng/pack-dotnet.sh artifacts/nuget

      - name: Restore packaged consumer from local NuGet feed
        run: >-
          dotnet restore packaging/consumer/PartyGameKit.PackageConsumer.csproj
          --source "$PWD/artifacts/nuget"

      - name: Build and run packaged consumer
        run: |
          dotnet build packaging/consumer/PartyGameKit.PackageConsumer.csproj --configuration Release --no-restore
          dotnet run --project packaging/consumer/PartyGameKit.PackageConsumer.csproj --configuration Release --no-build

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Restore Dart protocol package dependencies
        working-directory: interop/dart
        run: dart pub get

      - name: Check Dart formatting
        working-directory: interop/dart
        run: |
          dart format .
          git diff --exit-code -- .

      - name: Analyze Dart protocol package
        working-directory: interop/dart
        run: dart analyze

      - name: Test Dart canonical fixtures
        working-directory: interop/dart
        run: dart test

      - name: Pack Dart protocol source artifact
        run: |
          mkdir -p artifacts/dart
          tar -czf "artifacts/dart/partygamekit_protocol-${{ steps.version.outputs.version }}.tar.gz" \
            -C interop/dart pubspec.yaml README.md CHANGELOG.md lib

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript client dependencies
        working-directory: clients/typescript
        run: npm install --no-audit --no-fund

      - name: Build and test TypeScript browser client
        working-directory: clients/typescript
        run: npm test

      - name: Install Chromium for WebRTC integration
        working-directory: clients/typescript
        run: npx playwright install --with-deps chromium

      - name: Test real browser WebRTC DataChannel
        working-directory: clients/typescript
        run: npm run test:browser

      - name: Pack TypeScript prerelease artifact
        working-directory: clients/typescript
        run: |
          mkdir -p ../../artifacts/npm
          npm pack --pack-destination ../../artifacts/npm

      - name: Upload prerelease package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partygamekit-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
