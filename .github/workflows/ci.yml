name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.targets | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "Unable to resolve package version from Directory.Build.targets" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Dihor.GameKit.Networking.slnx

      - name: Build
        run: dotnet build Dihor.GameKit.Networking.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Dihor.GameKit.Networking.slnx --configuration Release --no-build

      - name: Run neutral communication demo
        run: >-
          dotnet run
          --project samples/CommunicationDemo/Dihor.GameKit.Networking.Sample.CommunicationDemo.csproj
          --configuration Release
          --no-build

      - name: Run automatic connectivity demo
        run: >-
          dotnet run
          --project samples/AutoConnectivityDemo/Dihor.GameKit.Networking.Sample.AutoConnectivityDemo.csproj
          --configuration Release
          --no-build

      - name: Pack NuGet prerelease artifacts
        run: bash eng/pack-dotnet.sh artifacts/nuget

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore and build Android package consumers
        shell: bash
        run: |
          sed -E -i "s/Version=\"0\.2\.0-preview\.[0-9]+\"/Version=\"${{ steps.version.outputs.version }}\"/g" \
            packaging/android-client/Dihor.GameKit.Networking.AndroidClient.PackageConsumer.csproj \
            packaging/android-host/Dihor.GameKit.Networking.AndroidHost.PackageConsumer.csproj
          for PROJECT in \
            packaging/android-client/Dihor.GameKit.Networking.AndroidClient.PackageConsumer.csproj \
            packaging/android-host/Dihor.GameKit.Networking.AndroidHost.PackageConsumer.csproj; do
            NUGET_PACKAGES="$PWD/artifacts/android-packages" \
              dotnet restore "$PROJECT" \
              --no-cache \
              --source "$PWD/artifacts/nuget" \
              --source "https://api.nuget.org/v3/index.json"
            dotnet build "$PROJECT" --configuration Release --no-restore
          done

      - name: Restore packaged consumer from local NuGet feed
        run: >-
          dotnet restore packaging/consumer/Dihor.GameKit.Networking.PackageConsumer.csproj
          --source "$PWD/artifacts/nuget"

      - name: Build and run packaged consumer
        run: |
          dotnet build packaging/consumer/Dihor.GameKit.Networking.PackageConsumer.csproj --configuration Release --no-restore
          dotnet run --project packaging/consumer/Dihor.GameKit.Networking.PackageConsumer.csproj --configuration Release --no-build

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Restore Dart protocol package dependencies
        working-directory: interop/dart
        run: dart pub get

      - name: Check Dart formatting
        working-directory: interop/dart
        run: |
          dart format .
          git diff --exit-code -- .

      - name: Analyze Dart protocol package
        working-directory: interop/dart
        run: dart analyze

      - name: Test Dart canonical fixtures
        working-directory: interop/dart
        run: dart test

      - name: Restore Dart runtime package dependencies
        working-directory: clients/dart
        run: dart pub get

      - name: Check Dart runtime formatting
        working-directory: clients/dart
        run: |
          dart format .
          git diff --exit-code -- .

      - name: Analyze Dart runtime package
        working-directory: clients/dart
        run: dart analyze

      - name: Test Dart runtime package
        working-directory: clients/dart
        run: dart test

      - name: Test Dart client against .NET LAN listener
        shell: bash
        run: |
          set -euo pipefail
          DESCRIPTOR_FILE="$RUNNER_TEMP/dihor-dart-lan-descriptor.txt"
          HOST_LOG="$RUNNER_TEMP/dihor-dart-lan-host.log"
          rm -f "$DESCRIPTOR_FILE" "$HOST_LOG"

          dotnet run             --project samples/DartLanInteropHost/Dihor.GameKit.Networking.Sample.DartLanInteropHost.csproj             --configuration Release             --no-build             -- "$DESCRIPTOR_FILE" >"$HOST_LOG" 2>&1 &
          HOST_PID=$!

          cleanup() {
            kill "$HOST_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..100}; do
            if [[ -s "$DESCRIPTOR_FILE" ]]; then
              break
            fi
            if ! kill -0 "$HOST_PID" 2>/dev/null; then
              cat "$HOST_LOG"
              wait "$HOST_PID"
              exit 1
            fi
            sleep 0.1
          done

          if [[ ! -s "$DESCRIPTOR_FILE" ]]; then
            cat "$HOST_LOG"
            echo "Dart interop host did not publish a connection descriptor." >&2
            exit 1
          fi

          (
            cd clients/dart
            dart run tool/dotnet_lan_integration.dart "$DESCRIPTOR_FILE"
          )
          wait "$HOST_PID"
          cat "$HOST_LOG"
          trap - EXIT

      - name: Pack Dart protocol source artifact
        run: |
          mkdir -p artifacts/dart
          tar -czf "artifacts/dart/dihor_gamekit_networking_protocol-${{ steps.version.outputs.version }}.tar.gz" \
            -C interop/dart pubspec.yaml README.md CHANGELOG.md lib

      - name: Pack Dart runtime source artifact
        run: |
          mkdir -p artifacts/dart
          tar -czf "artifacts/dart/dihor_gamekit_networking-${{ steps.version.outputs.version }}.tar.gz" \
            -C clients/dart pubspec.yaml README.md CHANGELOG.md lib

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript client dependencies
        working-directory: clients/typescript
        run: npm install --no-audit --no-fund

      - name: Build and test TypeScript browser client
        working-directory: clients/typescript
        run: npm test

      - name: Install Chromium for WebRTC integration
        working-directory: clients/typescript
        run: npx playwright install --with-deps chromium

      - name: Test real browser WebRTC DataChannel
        working-directory: clients/typescript
        run: npm run test:browser

      - name: Pack TypeScript prerelease artifact
        working-directory: clients/typescript
        run: |
          mkdir -p ../../artifacts/npm
          npm pack --pack-destination ../../artifacts/npm

      - name: Upload prerelease package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dihor-gamekit-networking-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
