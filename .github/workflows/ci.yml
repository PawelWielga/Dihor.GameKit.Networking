name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore PartyGameKit.slnx

      - name: Build
        run: dotnet build PartyGameKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PartyGameKit.slnx --configuration Release --no-build

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Restore Dart conformance dependencies
        working-directory: interop/dart
        run: dart pub get

      - name: Check Dart formatting
        working-directory: interop/dart
        run: |
          dart format .
          git diff --exit-code -- .

      - name: Analyze Dart conformance adapter
        working-directory: interop/dart
        run: dart analyze

      - name: Test Dart canonical fixtures
        working-directory: interop/dart
        run: dart test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript client dependencies
        working-directory: clients/typescript
        run: npm install --no-audit --no-fund

      - name: Build and test TypeScript browser client
        working-directory: clients/typescript
        run: npm test

      - name: Verify TypeScript package contents
        working-directory: clients/typescript
        run: npm pack --dry-run
