name: Prerelease

on:
  push:
    tags:
      - 'v0.2.0-preview.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Prerelease tag, for example v0.2.0-preview.3
        required: true
        default: v0.2.0-preview.3

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v0\.2\.0-preview\.[0-9]+$ ]]; then
            echo "Unsupported prerelease tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test .NET
        run: |
          dotnet restore PartyGameKit.slnx
          dotnet build PartyGameKit.slnx --configuration Release --no-restore
          dotnet test PartyGameKit.slnx --configuration Release --no-build

      - name: Run neutral communication demo
        run: >-
          dotnet run
          --project samples/CommunicationDemo/PartyGameKit.Sample.CommunicationDemo.csproj
          --configuration Release
          --no-build

      - name: Pack NuGet artifacts
        run: bash eng/pack-dotnet.sh artifacts/nuget "${{ steps.version.outputs.version }}"

      - name: Verify NuGet packages as a fresh consumer
        shell: bash
        run: |
          sed -E -i "s/Version=\"0\.2\.0-preview\.[0-9]+\"/Version=\"${{ steps.version.outputs.version }}\"/g" \
            packaging/consumer/PartyGameKit.PackageConsumer.csproj
          dotnet restore packaging/consumer/PartyGameKit.PackageConsumer.csproj \
            --source "$PWD/artifacts/nuget"
          dotnet build packaging/consumer/PartyGameKit.PackageConsumer.csproj --configuration Release --no-restore
          dotnet run --project packaging/consumer/PartyGameKit.PackageConsumer.csproj --configuration Release --no-build

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build and test Dart protocol package
        working-directory: interop/dart
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed .
          dart analyze
          dart test

      - name: Pack Dart protocol source artifact
        shell: bash
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" interop/dart/pubspec.yaml
          mkdir -p artifacts/dart
          tar -czf "artifacts/dart/partygamekit_protocol-${{ steps.version.outputs.version }}.tar.gz" \
            -C interop/dart pubspec.yaml README.md CHANGELOG.md lib

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript client dependencies
        working-directory: clients/typescript
        run: npm install --no-audit --no-fund

      - name: Build and test TypeScript client
        working-directory: clients/typescript
        run: npm test

      - name: Install Chromium for WebRTC integration
        working-directory: clients/typescript
        run: npx playwright install --with-deps chromium

      - name: Test real browser WebRTC DataChannel
        working-directory: clients/typescript
        run: npm run test:browser

      - name: Pack TypeScript client
        working-directory: clients/typescript
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          mkdir -p ../../artifacts/npm
          npm pack --pack-destination ../../artifacts/npm

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partygamekit-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error

      - name: Create or update GitHub prerelease
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/nuget/* artifacts/npm/* artifacts/dart/* --clobber
          else
            gh release create "$TAG" \
              artifacts/nuget/* artifacts/npm/* artifacts/dart/* \
              --prerelease \
              --generate-notes \
              --title "PartyGameKit ${{ steps.version.outputs.version }}"
          fi
